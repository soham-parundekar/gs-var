[project]
name = "gs-var"
version = "1.0.0"
description = "Reconstruction of Goldman Sachs's disclosed Value-at-Risk model on a public-data proxy book"
requires-python = ">=3.11"

[tool.ruff]
# 110 rather than 88. The code carries long but meaningful names (factor keys,
# disclosure column names) and splitting those across lines to satisfy a
# narrower limit hurts more than it helps.
line-length = 110

[tool.ruff.lint.per-file-ignores]
# The parser fixtures are real 10-K table rows. Wrapping them would stop them
# looking like the HTML the parser has to survive, which is the point of them.
"tests/test_item7a.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::RuntimeWarning"]
